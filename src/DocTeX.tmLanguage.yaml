name: DocTeX
patterns:
- include: '#doctex-document-env'
- include: '#doctex-verbatim-env'
- include: '#verb'
- include: '#macrocode'
- include: '#guards'
- include: '#comments'
- include: '#latexSource'
repository:
  guards:
    match: ^%(\<[^\>]*\>)
    name: entity.name.function.filename.latex
  verb:
    patterns:
    - match: (?!\\)(\|)([^\|]*)(\|)
      captures:
        '1':
          name: punctuation.definition.verb.latex
        '2':
          name: markup.raw.verb.latex
        '3':
          name: punctuation.definition.verb.latex
      name: meta.function.verb.latex
    - match: (?!\\)(")([^"]*)(")
      captures:
        '1':
          name: punctuation.definition.verb.latex
        '2':
          name: markup.raw.verb.latex
        '3':
          name: punctuation.definition.verb.latex
      name: meta.function.verb.latex
  doctex-verbatim-env:
    patterns:
    - begin: ^(%)(\s*\\begin\{((?:fboxv|boxedv|V|v|spv)erbatim\*?)\})
      end: ^(%)(\s*\\end\{\3\})
      captures:
        '1':
          name: comment.line.percentage.doctex
        '2':
          patterns:
          - include: '#macro-with-args-tokenizer'
      contentName: markup.raw.verbatim.latex
      name: meta.function.verbatim.latex
  doctex-document-env:
    patterns:
    - match: (\s*\\begin\{document\})
      captures:
        '1':
          patterns:
          - include: '#macro-with-args-tokenizer'
      comment: These two patterns match the \begin{document} and \end{document} commands,
        so that the environment matching pattern following them will ignore those commands.
        We override the '#document-env' entry from the LaTeX grammar because \end{document}
        does not end a dtx file.
    - match: (\s*\\end\{document\})
      captures:
        '1':
          patterns:
          - include: '#macro-with-args-tokenizer'
  macrocode:
    patterns:
    - begin: ^(%)    (\\begin\{macrocode\})
      captures:
        '1':
          name: comment.line.percentage.doctex
        '2':
          name: entity.name.tag.macrocode.doctex
      end: ^(%)    (\\end\{macrocode\})
      patterns:
      - include: '#guards'
      - include: '#newcommand-header-only'
      - include: '#basic-unbalanced-latex-rules'
      - include: text.tex
  comments:
    patterns:
    - match: (^[ \t]*)%?%
      name: comment.line.percentage.doctex
    - match: \^\^A.*$\n?
      name: comment.line.percentage.tex
    - match: (?<=[^%\\])%
      name: invalid
  newcommand-header-only:
    patterns:
    - match: ((\\)(?:newcommand|renewcommand|providecommand|(?:re)?newrobustcmd|DeclareRobustCommand|newenvironment|renewenvironment)\*?)(\{)?((\\)?[\p{Alphabetic}@]+\*?)(\})?(?:(\[)[^\]]*(\])){0,2}(\{)
      captures:
        '1':
          name: storage.type.function.latex
        '2':
          name: punctuation.definition.function.latex
        '3':
          name: punctuation.definition.begin.latex
        '4':
          name: support.function.general.latex
        '5':
          name: punctuation.definition.function.latex
        '6':
          name: punctuation.definition.end.latex
        '7':
          name: punctuation.definition.arguments.optional.begin.latex
        '8':
          name: punctuation.definition.arguments.optional.end.latex
        '9':
          name: punctuation.definition.arguments.begin.latex
  latexSource:
    patterns: []
scopeName: text.tex.doctex
